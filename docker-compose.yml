services:

  backend:
    build:
      context: ./backend
    container_name: interview-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: interview-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped